# Stowkeeper Maintenance Host Configuration
# Source this file with: source /opt/stowkeeper/conf/maintenance.conf
#
# This configuration is ONLY for the isolated maintenance host that performs
# weekly prune/check operations on the B2 repository. It MUST NOT be present
# on backup client hosts.
#
# SECURITY: The elevated B2 key has deleteFiles permission. Keep it on the
# maintenance host only. Rotate immediately if compromised.

# Repository target for maintenance (B2 only)
RESTIC_REPOSITORY_b2="s3:https://s3.us-west-000.backblazeb2.com/stowkeeper-b2"
RESTIC_PASSWORD_FILE_b2="/opt/stowkeeper/conf/.restic-password-b2"

# Elevated Backblaze B2 Application Key (deleteFiles + listFiles)
# This key is REQUIRED for restic forget --prune to remove old snapshots.
AWS_ACCESS_KEY_ID=""
AWS_SECRET_ACCESS_KEY=""

# HashiCorp Vault AppRole for maintenance host
# Use a separate role ID with restricted policies (read-only KV, no write).
VAULT_ADDR="https://vault.local:8200"
VAULT_ROLE_ID_stowkeeper_b2=""
VAULT_SECRET_ID_stowkeeper_b2=""

# Telegram notifications (same as pilot.conf)
TELEGRAM_BOT_TOKEN=""
TELEGRAM_CHAT_ID=""

# SMTP / msmtp configuration (same as pilot.conf)
SMTP_HOST=""
SMTP_PORT="587"
SMTP_USER=""
SMTP_PASS=""
SMTP_FROM="stowkeeper@example.com"
SMTP_TO="ops@example.com"
SMTP_RATE_LIMIT=10

# Metrics
METRICS_FILE="/var/lib/prometheus/node-exporter/stowkeeper.prom"

# Digest queue
DIGEST_DIR="/var/lib/stowkeeper/digest"
DEDUP_DIR="/var/lib/stowkeeper/dedup"

# Lock file (same as backup clients to prevent concurrent backup+maintenance)
LOCK_FILE="/var/lock/stowkeeper-backup.lock"

# Maintenance-only flags
MAINTENANCE_REPO="b2"
MAINTENANCE_MODE=true
