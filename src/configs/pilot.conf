# Stowkeeper Pilot Configuration
# Source this file with: source /opt/stowkeeper/conf/pilot.conf

# Dual-repository configuration
# Set REPS=("nas") for NAS-only backward compatibility
# Set REPOS=("nas" "b2") for dual-repo mode
REPOS=("nas" "b2")

# Per-repository RESTIC_REPOSITORY and RESTIC_PASSWORD_FILE
RESTIC_REPOSITORY_nas="sftp:user@nas.local:/backups/stowkeeper"
RESTIC_REPOSITORY_b2="s3:https://s3.us-west-000.backblazeb2.com/stowkeeper-b2"
RESTIC_PASSWORD_FILE_nas="/opt/stowkeeper/conf/.restic-password-nas"
RESTIC_PASSWORD_FILE_b2="/opt/stowkeeper/conf/.restic-password-b2"

# Legacy single-repo fallback (used when REPOS is not set)
RESTIC_REPOSITORY="${RESTIC_REPOSITORY:-${RESTIC_REPOSITORY_nas}}"
RESTIC_PASSWORD_FILE="${RESTIC_PASSWORD_FILE:-${RESTIC_PASSWORD_FILE_nas}}"

# Backup paths (space-separated)
BACKUP_PATHS_DB=("/var/lib/postgresql/dumps")
BACKUP_PATHS_FILES=("/home" "/var/www")
BACKUP_PATHS_CONFIG=("/etc")

# Exclusions
EXCLUDE_FILE="/opt/stowkeeper/conf/excludes.txt"

# Retention policy
RETENTION_POLICY="--keep-last 3 --keep-hourly 24 --keep-daily 14 --keep-weekly 8 --keep-monthly 12 --keep-yearly 5"

# Telegram notifications
TELEGRAM_BOT_TOKEN=""
TELEGRAM_CHAT_ID=""

# Database configuration (optional)
DB_TYPE="postgresql"
DB_HOST="localhost"
DB_USER="postgres"
DB_NAME="myapp"
DB_STDIN_THRESHOLD_GB="100"

# Backblaze B2 Application Key (write-only for backup clients)
AWS_ACCESS_KEY_ID=""
AWS_SECRET_ACCESS_KEY=""

# HashiCorp Vault AppRole authentication
VAULT_ADDR="https://vault.local:8200"
VAULT_ROLE_ID_stowkeeper_nas=""
VAULT_ROLE_ID_stowkeeper_b2=""
VAULT_SECRET_ID_stowkeeper_nas=""
VAULT_SECRET_ID_stowkeeper_b2=""

# SMTP / msmtp configuration
SMTP_HOST=""
SMTP_PORT="587"
SMTP_USER=""
SMTP_PASS=""
SMTP_FROM="stowkeeper@example.com"
SMTP_TO="ops@example.com"
SMTP_RATE_LIMIT=10

# Metrics
METRICS_FILE="/var/lib/prometheus/node-exporter/stowkeeper.prom"

# Digest queue
DIGEST_DIR="/var/lib/stowkeeper/digest"
DEDUP_DIR="/var/lib/stowkeeper/dedup"

# Lock file
LOCK_FILE="/var/lock/stowkeeper-backup.lock"
